[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 57600
monitor_speed = 115200

lib_deps =
    MPU6050
    ArduinoJson
    TinyGPS++
    PubSubClient

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_speed = 921600
monitor_speed = 115200

lib_deps =
    MPU6050
    ArduinoJson
    TinyGPS++
    ESP8266WiFi

[env:advanced]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_speed = 921600
monitor_speed = 115200

lib_deps =
    MPU6050
    ArduinoJson
    TinyGPS++
    PubSubClient
    MQTT
